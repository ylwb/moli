name: Termux aarch64 cross build

on:
  workflow_dispatch:
  push:
    branches: [termux-aarch64]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-musl:
    name: aarch64-unknown-linux-musl (zig CC/linker, prebuilt V8)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout moli source
        uses: actions/checkout@v4
        with:
          repository: lexmount/moli
          ref: main
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust + musl target
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustc --version
          rustup target add aarch64-unknown-linux-musl

      - name: Install zig
        run: |
          set -uo pipefail
          echo "=== downloading zig ==="
          curl -fsSL --max-time 300 -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.12.0/zig-linux-x86_64-0.12.0.tar.xz
          ls -lh /tmp/zig.tar.xz
          tar xf /tmp/zig.tar.xz -C /tmp
          sudo mv /tmp/zig-linux-x86_64-0.12.0/zig /usr/local/bin/zig
          zig version

      - name: Create zig-cc / zig-cxx wrappers (filter --target args)
        run: |
          set -euo pipefail
          cat > zig-cc <<'WRAPPER'
#!/bin/bash
# zig cc gcc-compatible wrapper: strip --target/-target args zig already handles
args=()
skip_next=0
for a in "$@"; do
  if [ "$skip_next" = "1" ]; then skip_next=0; continue; fi
  case "$a" in
    --target=*|-target=*|--target|-target) skip_next=1; [ "${a#*=}" != "${a}" ] && skip_next=0 ;;
    *) args+=("$a") ;;
  esac
done
exec /usr/local/bin/zig cc --target aarch64-linux-musl --release "${args[@]}"
WRAPPER
          cat > zig-cxx <<'WRAPPER'
#!/bin/bash
args=()
skip_next=0
for a in "$@"; do
  if [ "$skip_next" = "1" ]; then skip_next=0; continue; fi
  case "$a" in
    --target=*|-target=*|--target|-target) skip_next=1; [ "${a#*=}" != "${a}" ] && skip_next=0 ;;
    *) args+=("$a") ;;
  esac
done
exec /usr/local/bin/zig c++ --target aarch64-linux-musl --release "${args[@]}"
WRAPPER
          chmod +x zig-cc zig-cxx
          # quick sanity: compile + link a trivial C file
          printf 'int main(){return 0;}' > /tmp/t.c
          ./zig-cc /tmp/t.c -o /tmp/t && /tmp/t && echo "zig-cc wrapper OK"

      - name: Build moli (musl via zig)
        run: |
          set -euo pipefail
          export CC="$PWD/zig-cc"
          export CXX="$PWD/zig-cxx"
          # rustc final link step: use zig directly as a GCC-like linker driver
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/usr/local/bin/zig
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER_ARGS="-target aarch64-linux-musl --release -Wl,-z,noexecstack"
          cargo build --release \
            --target aarch64-unknown-linux-musl \
            --package moli

      - name: Inspect binary
        run: |
          set -euo pipefail
          bin=target/aarch64-unknown-linux-musl/release/moli
          file "$bin"
          ls -lh "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moli-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/moli
          if-no-files-found: error
          retention-days: 30
