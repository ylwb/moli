name: Termux aarch64 cross build

on:
  workflow_dispatch:
  push:
    branches: [termux-aarch64]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-musl:
    name: aarch64-unknown-linux-musl (NDK clang CC + zig linker, prebuilt V8)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout moli source
        uses: actions/checkout@v4
        with:
          repository: lexmount/moli
          ref: main
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust + musl target
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustc --version
          rustup target add aarch64-unknown-linux-musl

      - name: Download NDK
        run: |
          set -euo pipefail
          echo "=== downloading NDK r26c ==="
          curl -fSL --max-time 600 -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          ls -lh /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt/
          sudo mv /opt/android-ndk-r26c /opt/ndk
          echo "=== NDK installed ==="
          ls /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ | grep aarch64

      - name: Download zig (linker only)
        run: |
          set -uo pipefail
          curl -fsSL --max-time 300 -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.12.0/zig-linux-x86_64-0.12.0.tar.xz
          tar xf /tmp/zig.tar.xz -C /tmp
          sudo mv /tmp/zig-linux-x86_64-0.12.0/zig /usr/local/bin/zig
          zig version

      - name: Configure NDK clang as CC/CXX for musl target
        run: |
          set -euo pipefail
          ndk_clang_dir=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin
          ndk_sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          # NDK clang compiles aarch64; --target overrides arch for C files
          clang="$ndk_clang_dir/aarch64-linux-android21-clang"
          echo "clang: $clang"
          $clang --version

          # Create CC wrapper: NDK clang, force musl target, use NDK sysroot headers
          printf '#!/bin/bash\nCLANG_DIR=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin\nSYSROOT=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot\nexec "$CLANG_DIR/aarch64-linux-android21-clang" --target=aarch64-linux-musl --sysroot="$SYSROOT" --gcc-toolchain=/opt/ndk "$@"\n' > cc-ndk
          chmod +x cc-ndk
          printf '#!/bin/bash\nCLANG_DIR=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin\nSYSROOT=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot\nexec "$CLANG_DIR/aarch64-linux-android21-clang++" --target=aarch64-linux-musl --sysroot="$SYSROOT" --gcc-toolchain=/opt/ndk "$@"\n' > cxx-ndk
          chmod +x cxx-ndk

          # Self-test: compile a trivial C file
          printf 'int main(){return 0;}' > /tmp/t.c
          ./cc-ndk -O2 -o /tmp/t /tmp/t.c && echo "cc-ndk OK (link skipped, no libc yet)" || echo "cc-ndk compile test done (link may need libc)"

      - name: Build moli (musl: NDK clang CC + zig linker)
        run: |
          set -euo pipefail
          export CC="$PWD/cc-ndk"
          export CXX="$PWD/cxx-ndk"
          # Linker: zig provides musl libc + static link
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/usr/local/bin/zig
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER_ARGS="-target aarch64-linux-musl --release"
          cargo build --release \
            --target aarch64-unknown-linux-musl \
            --package moli

      - name: Inspect binary
        run: |
          set -euo pipefail
          bin=target/aarch64-unknown-linux-musl/release/moli
          file "$bin"
          ls -lh "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moli-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/moli
          if-no-files-found: error
          retention-days: 30
