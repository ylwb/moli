name: Termux aarch64 cross build

on:
  workflow_dispatch:
  push:
    branches: [termux-aarch64]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-musl:
    name: aarch64-unknown-linux-musl prebuilt V8 NDK CC zig linker
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout moli source
        uses: actions/checkout@v4
        with:
          repository: lexmount/moli
          ref: main
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust + musl target
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustc --version
          rustup target add aarch64-unknown-linux-musl

      - name: Download NDK
        run: |
          set -euo pipefail
          echo "=== downloading NDK r26c ==="
          curl -fSL --max-time 600 -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          ls -lh /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt/
          sudo mv /opt/android-ndk-r26c /opt/ndk
          echo "=== NDK installed ==="
          ls /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/ | grep aarch64


      - name: Download zig (linker only)
        run: |
          set -uo pipefail
          curl -fsSL --max-time 300 -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.12.0/zig-linux-x86_64-0.12.0.tar.xz
          tar xf /tmp/zig.tar.xz -C /tmp
          sudo mv /tmp/zig-linux-x86_64-0.12.0/zig /usr/local/bin/zig
          zig version

      - name: Configure NDK clang as CC/CXX for musl target
        run: |
          set -euo pipefail
          ndk_clang_dir=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin
          ndk_sysroot=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          # NDK clang compiles aarch64; --target overrides arch for C files
          clang="$ndk_clang_dir/aarch64-linux-android21-clang"
          echo "clang: $clang"
          $clang --version

          # Create CC wrapper: NDK clang, force musl target, use NDK sysroot headers
          
          # Add kernel asm/ headers to NDK sysroot (fixes missing asm/types.h)
          echo "=== patching NDK sysroot with kernel headers ==="
          curl -fsSL --max-time 300 -o /tmp/linux-kernel.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.tar.xz
          tar xf /tmp/linux-kernel.tar.xz -C /tmp \
            linux-6.6/include \
            linux-6.6/arch/arm64/include/uapi/asm
          # NDK sysroot does not have a/ dir; create the include search path it uses
          # NDK clang --target=aarch64-linux-gnu searches sysroot/usr/include and sysroot/usr/include/aarch64-linux-gnu
          # Link aarch64 asm/ and asm-generic/ into NDK sysroot so <asm/...> resolves
          sudo ln -sf /tmp/linux-6.6/arch/arm64/include/uapi/asm "$ndk_sysroot/usr/include/asm"
          sudo ln -sf /tmp/linux-6.6/include/uapi/asm-generic "$ndk_sysroot/usr/include/asm-generic"
          # Auto-create shims for any missing asm/*.h that have a generic counterpart
          ASM_DIR=/tmp/linux-6.6/arch/arm64/include/uapi/asm
          GENERIC_DIR=/tmp/linux-6.6/include/uapi/asm-generic
          for h in $(ls "$GENERIC_DIR"); do
            if [ ! -f "$ASM_DIR/$h" ]; then
              echo "#include <asm-generic/$h>" > "$ASM_DIR/$h"
              echo "  created shim: asm/$h -> asm-generic/$h"
            fi
          done
          echo "asm dir now: $(ls "$ASM_DIR")"
          # Suppress kernel UAPI #warning (triggered when -Werror is used)
          sed -i '/^#warning/d' /tmp/linux-6.6/include/uapi/linux/types.h 2>/dev/null || true
          echo "=== testing linux/types.h compile ==="
          printf '#include <linux/types.h>\nint main(){return 0;}' > /tmp/linux-test.c
          "$ndk_clang_dir/aarch64-linux-android21-clang" --target=aarch64-linux-gnu --sysroot="$ndk_sysroot" \
            -I /tmp/linux-6.6/include/uapi -c -o /tmp/linux-test.o /tmp/linux-test.c \
            && echo "linux/types.h compile OK" || echo "linux/types.h compile FAILED"

          printf '#!/bin/bash\nCLANG_DIR=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin\nSYSROOT=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot\nargs=()\nprev_was_target=0\nfor a in "$@"; do\n  if [ "$prev_was_target" = "1" ]; then prev_was_target=0; continue; fi\n  case "$a" in\n    --target=*|-target=*) : ;;\n    --target|-target) prev_was_target=1 ;;\n    *) args+=("$a") ;;\n  esac\ndone\nexec "$CLANG_DIR/aarch64-linux-android21-clang" --target=aarch64-linux-gnu --sysroot="$SYSROOT" -I /tmp/linux-6.6/include/uapi "${args[@]}"\n' > cc-ndk
          chmod +x cc-ndk
          printf '#!/bin/bash\nCLANG_DIR=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin\nSYSROOT=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot\nargs=()\nprev_was_target=0\nfor a in "$@"; do\n  if [ "$prev_was_target" = "1" ]; then prev_was_target=0; continue; fi\n  case "$a" in\n    --target=*|-target=*) : ;;\n    --target|-target) prev_was_target=1 ;;\n    *) args+=("$a") ;;\n  esac\ndone\nexec "$CLANG_DIR/aarch64-linux-android21-clang++" --target=aarch64-linux-gnu --sysroot="$SYSROOT" -I /tmp/linux-6.6/include/uapi "${args[@]}"\n' > cxx-ndk
          chmod +x cxx-ndk

          # Self-test: compile a trivial C file
          printf 'int main(){return 0;}' > /tmp/t.c
          ./cc-ndk -c -O2 -o /tmp/t.o /tmp/t.c && echo "cc-ndk compile-only OK"

      - name: Build moli (musl, NDK clang CC + zig linker)
        run: |
          set -euo pipefail
          export CC="$PWD/cc-ndk"
          export CXX="$PWD/cxx-ndk"
          NDK_SYSROOT=/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          # bindgen calls clang directly (not via CC); tell it to use NDK aarch64 sysroot
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_musl="--target=aarch64-linux-gnu --sysroot=$NDK_SYSROOT --gcc-toolchain=/opt/ndk"
          # CMake compiler-test (full link) fails: NDK sysroot has no musl crt1.o etc.
          # Skip the test; we already verified -c compilation works.
          export CMAKE_C_COMPILER_WORKS=1
          export CMAKE_CXX_COMPILER_WORKS=1
          # Linker: zig provides musl libc + static link
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/usr/local/bin/zig
          # zig provides musl libc internally; -nostdlib avoids looking for crt1.o from NDK sysroot
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER_ARGS="-target aarch64-linux-musl --release -nostdlib -lc"
          cargo build --release \
            --target aarch64-unknown-linux-musl \
            --package moli

      - name: Inspect binary
        run: |
          set -euo pipefail
          bin=target/aarch64-unknown-linux-musl/release/moli
          file "$bin"
          ls -lh "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moli-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/moli
          if-no-files-found: error
          retention-days: 30
