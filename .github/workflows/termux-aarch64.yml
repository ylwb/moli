name: Termux aarch64 cross build

on:
  workflow_dispatch:
  push:
    branches: [termux-aarch64]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-android:
    name: NDK aarch64-linux-android
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: lexmount/moli
          ref: main
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust pinned toolchain
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustc --version
          rustup target add aarch64-linux-android26

      - name: Download Android NDK r26c
        run: |
          set -euo pipefail
          curl -fsSL -o ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q -o ndk.zip
          ndk_dir="$(find . -maxdepth 1 -type d -name 'android-ndk-r26c' | head -n1)"
          echo "ANDROID_NDK_HOME=${ndk_dir#./}" >> "$GITHUB_ENV"
          echo "${ndk_dir#./}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          aarch64-linux-android26-clang --version
          aarch64-linux-android26-clang++ --version

      - name: Install libssl and build static libcurl (NDK)
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build \
            libssl-dev pkg-config

          # Build a static libcurl with OpenSSL for bionic, place it where
          # cc/cmake look, and hand its flags to the curl-sys build script.
          curl -fsSL -o curl-8.21.0.tar.gz \
            https://curl.se/download/curl-8.21.0.tar.gz
          tar xzf curl-8.21.0.tar.gz

          mkdir -p curl-static-build
          cmake -S curl-8.21.0 -B curl-static-build -G Ninja \
            -DCURL_STATIC=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR="$HOME/.local/static/ssl" \
            -DCMAKE_TOOLCHAIN_FILE= 2>/dev/null || true

          # Cross CMake via NDK toolchain file
          cmake --version
          CC=clang CXX=clang++ cmake -S curl-8.21.0 -B curl-static-build -G Ninja \
            -DCURL_STATIC=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_ROOT_DIR= \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_NDK="${ANDROID_NDK_HOME}" \
            -DCMAKE_ANDROID_ABI=arm64-v8a \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build curl-static-build
          ls -lh curl-static-build/libcurl.a

      - name: Build moli
        run: |
          set -euo pipefail
          clang_version="aarch64-linux-android26-clang"
          cc="${clang_version}" cxx="${clang_version}+" \
          cmake="-DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
          V8_FROM_SOURCE=1 \
          TARGET=aarch64-linux-android26 \
          HOST=x86_64-unknown-linux-gnu \
          API_LEVEL=26 \
          CARGO_BUILD_TARGET=aarch64-linux-android26 \
          RUSTY_V8_SRC_BINDING_URL="" \
          cargo build --release \
            --target aarch64-linux-android26 \
            --package moli \
            --features v8_enable_sandbox

      - name: Check binary
        run: |
          set -euo pipefail
          bin=target/aarch64-linux-android26/release/moli
          file "$bin"
          ldd "$bin" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moli-aarch64-linux-android
          path: target/aarch64-linux-android26/release/moli
          if-no-files-found: error
          retention-days: 30

  build-musl:
    name: musl aarch64 (Termux fallback)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          repository: lexmount/moli
          ref: main
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust pinned toolchain
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustc --version
          rustup target add aarch64-unknown-linux-musl

      - name: Install musl cross toolchain
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-musl g++-aarch64-linux-musl cmake ninja-build \
            musl-tools

      - name: Build moli
        run: |
          set -euo pipefail
          cargo build --release \
            --target aarch64-unknown-linux-musl \
            --package moli \
            --features v8_enable_sandbox

      - name: Check binary
        run: |
          set -euo pipefail
          bin=target/aarch64-unknown-linux-musl/release/moli
          file "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moli-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/moli
          if-no-files-found: error
          retention-days: 30
