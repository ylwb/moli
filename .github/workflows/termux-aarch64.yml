name: Termux aarch64 cross build

on:
  workflow_dispatch:
  push:
    branches: [termux-aarch64]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # -----------------------------------------------------------------
  # musl static build: uses prebuilt librusty_v8_release_aarch64-unknown-linux-musl.a.gz
  # (no V8 source build needed — moli-renderer-v8 does NOT enable
  #  v8_enable_pointer_compression for the musl target)
  # -----------------------------------------------------------------
  build-musl:
    name: aarch64-unknown-linux-musl (prebuilt V8)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout moli source
        uses: actions/checkout@v4
        with:
          repository: lexmount/moli
          ref: main
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust + musl target
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustc --version
          rustup target add aarch64-unknown-linux-musl

      - name: Install musl cross linker
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          aarch64-linux-musl-gcc --version

      - name: Build moli (musl, prebuilt V8)
        run: |
          set -euo pipefail
          # Link statically against musl: use aarch64-linux-musl-gcc as rustc's linker driver.
          # V8: download prebuilt aarch64-unknown-linux-musl archive (no V8_FROM_SOURCE needed).
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc
          export CC=aarch64-linux-musl-gcc
          export CXX=aarch64-linux-musl-g++
          # aws-lc-rs / openssl / curl all need C cross compilation; keep default features on.
          # --no-default-features would drop jemalloc, fine for musl.
          cargo build --release \
            --target aarch64-unknown-linux-musl \
            --package moli

      - name: Inspect binary
        run: |
          set -euo pipefail
          bin=target/aarch64-unknown-linux-musl/release/moli
          file "$bin"
          ls -lh "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moli-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/moli
          if-no-files-found: error
          retention-days: 30
