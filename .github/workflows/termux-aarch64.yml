name: Termux aarch64 cross build

on:
  workflow_dispatch:
  push:
    branches: [termux-aarch64]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-musl:
    name: aarch64-unknown-linux-musl (zig CC/linker, prebuilt V8)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout moli source
        uses: actions/checkout@v4
        with:
          repository: lexmount/moli
          ref: main
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust + musl target
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustc --version
          rustup target add aarch64-unknown-linux-musl

      - name: Install zig
        run: |
          set -uo pipefail
          echo "=== downloading zig ==="
          curl -fsSL --max-time 300 -o /tmp/zig.tar.xz \
            https://ziglang.org/download/0.12.0/zig-linux-x86_64-0.12.0.tar.xz
          ls -lh /tmp/zig.tar.xz
          tar xf /tmp/zig.tar.xz -C /tmp
          sudo mv /tmp/zig-linux-x86_64-0.12.0/zig /usr/local/bin/zig
          zig version

      - name: Create zig-cc / zig-cxx wrappers
        run: |
          set -euo pipefail
          zig_dir=/usr/local/bin
          printf '#!/bin/bash\nargs=()\nprev_was_target=0\nfor a in "$@"; do\n  if [ "$prev_was_target" = "1" ]; then prev_was_target=0; continue; fi\n  case "$a" in\n    --target=*) : ;;\n    -target=*) : ;;\n    --target) prev_was_target=1 ;;\n    -target) prev_was_target=1 ;;\n    *) args+=("$a") ;;\n  esac\ndone\nexec "%s/zig" cc --target aarch64-linux-musl --release "${args[@]}"\n' "$zig_dir" > zig-cc
          printf '#!/bin/bash\nargs=()\nprev_was_target=0\nfor a in "$@"; do\n  if [ "$prev_was_target" = "1" ]; then prev_was_target=0; continue; fi\n  case "$a" in\n    --target=*) : ;;\n    -target=*) : ;;\n    --target) prev_was_target=1 ;;\n    -target) prev_was_target=1 ;;\n    *) args+=("$a") ;;\n  esac\ndone\nexec "%s/zig" c++ --target aarch64-linux-musl --release "${args[@]}"\n' "$zig_dir" > zig-cxx
          chmod +x zig-cc zig-cxx
          echo "--- zig-cc ---"
          cat zig-cc
          printf 'int main(){return 0;}' > /tmp/t.c
          ./zig-cc /tmp/t.c -o /tmp/t && /tmp/t && echo "zig-cc wrapper OK"

      - name: Build moli (musl via zig)
        run: |
          set -euo pipefail
          export CC="$PWD/zig-cc"
          export CXX="$PWD/zig-cxx"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=/usr/local/bin/zig
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER_ARGS="-target aarch64-linux-musl --release"
          cargo build --release \
            --target aarch64-unknown-linux-musl \
            --package moli

      - name: Inspect binary
        run: |
          set -euo pipefail
          bin=target/aarch64-unknown-linux-musl/release/moli
          file "$bin"
          ls -lh "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moli-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/moli
          if-no-files-found: error
          retention-days: 30
