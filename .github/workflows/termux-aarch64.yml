name: Termux aarch64 cross build

on:
  workflow_dispatch:
  push:
    branches: [termux-aarch64]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-musl:
    name: aarch64-unknown-linux-musl (prebuilt V8, zig linker)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout moli source
        uses: actions/checkout@v4
        with:
          repository: lexmount/moli
          ref: main
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust + musl target
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustc --version
          rustup target add aarch64-unknown-linux-musl

      - name: Install zig (musl cross C compiler + linker)
        run: |
          set -euo pipefail
          curl -fsSL -o zig.tar.xz \
            https://ziglang.org/builds/zig-linux-x86_64-0.12.0.tar.xz
          tar xf zig.tar.xz
          mv zig-linux-x86_64-0.12.0 zig
          echo "$PWD/zig" >> "$GITHUB_PATH"
          zig version

      - name: Build moli (musl via zig)
        run: |
          set -euo pipefail
          # zig emulates GCC for the cc crate: "zig cc" = C compiler, "zig c++" = C++
          # --target aarch64-linux-musl gives fully static musl binary
          export ZIG_TARGET=aarch64-linux-musl
          # rustc's linker: use zig as a GCC-compatible driver
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER="$PWD/zig/zig"
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER_FLAGS="-target aarch64-linux-musl --release -Wl,--build-id"
          # C dependencies (aws-lc, curl, etc.) via zig as cc crate backend
          export CC="$PWD/zig/zig"
          export CXX="$PWD/zig/zig"
          # cc crate calls $CC with gcc args; zig needs "cc" or "c++" subcommand prefix
          # Use wrapper scripts instead:
          cat > /usr/local/bin/zig-cc-wrapper <<'EOF'
#!/bin/bash
# Translate gcc-style CC args to zig cc
args=()
for a in "$@"; do
  case "$a" in
    -target:aarch64-linux-musl) ;; # strip, zig handles target
    *) args+=("$a") ;;
  esac
done
exec zig cc --target aarch64-linux-musl --release "${args[@]}"
EOF
          cat > /usr/local/bin/zig-cxx-wrapper <<'EOF'
#!/bin/bash
args=()
for a in "$@"; do
  case "$a" in
    -target:aarch64-linux-musl) ;;
    *) args+=("$a") ;;
  esac
done
exec zig c++ --target aarch64-linux-musl --release "${args[@]}"
EOF
          # Note: these wrappers can't be in /usr/local/bin without sudo; put in $HOME/.local/bin
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/zig-cc" <<'EOF'
#!/bin/bash
exec "$ZIG_PATH" cc --target aarch64-linux-musl --release "$@"
EOF
          cat > "$HOME/.local/bin/zig-cxx" <<'EOF'
#!/bin/bash
exec "$ZIG_PATH" c++ --target aarch64-linux-musl --release "$@"
EOF
          chmod +x "$HOME/.local/bin/zig-cc" "$HOME/.local/bin/zig-cxx"
          export PATH="$HOME/.local/bin:$PATH"
          export ZIG_PATH="$PWD/zig/zig"

          cargo build --release \
            --target aarch64-unknown-linux-musl \
            --package moli

      - name: Inspect binary
        run: |
          set -euo pipefail
          bin=target/aarch64-unknown-linux-musl/release/moli
          file "$bin"
          ls -lh "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moli-aarch64-linux-musl
          path: target/aarch64-unknown-linux-musl/release/moli
          if-no-files-found: error
          retention-days: 30
