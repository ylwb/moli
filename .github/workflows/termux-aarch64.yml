name: Termux aarch64 cross build

on:
  workflow_dispatch:
  push:
    branches: [termux-aarch64]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build-android:
    name: NDK aarch64-linux-android
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout moli source
        uses: actions/checkout@v4
        with:
          repository: lexmount/moli
          ref: main
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust pinned toolchain + android target
        run: |
          set -euo pipefail
          toolchain="$(tr -d '[:space:]' < rust-toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          rustup default "$toolchain"
          rustc --version
          rustup target add aarch64-linux-android

      - name: Download Android NDK r26c
        run: |
          set -uo pipefail
          if ! command -v unzip >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends unzip
          fi
          curl -fsSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q -o ndk.zip
          ndk_dir="$(find . -maxdepth 1 -type d -name 'android-ndk-r26c' | head -n1)"
          if [ -z "$ndk_dir" ]; then
            echo "NDK dir not found; tree:"; ls -la; exit 1
          fi
          ndk_dir="${ndk_dir#./}"
          echo "ANDROID_NDK_HOME=$ndk_dir" >> "$GITHUB_ENV"
          echo "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          # verify toolchain is reachable
          "$ndk_dir/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" --version

      - name: Build moli (V8 from source, cross android)
        run: |
          set -euo pipefail
          # GITHUB_PATH from previous step is already on PATH here
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          export TARGET=aarch64-linux-android
          export HOST=x86_64-unknown-linux-gnu
          export API_LEVEL=26
          export ANDROID_PLATFORM=android-26
          export V8_FROM_SOURCE=1
          export EXTRA_GN_ARGS='target_os="android" v8_target_cpu="arm64" target_cpu="arm64"'
          # sanity: verify clang is actually reachable
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" --version
          cargo build --release \
            --target aarch64-linux-android \
            --package moli

      - name: Inspect binary
        run: |
          set -euo pipefail
          bin=target/aarch64-linux-android/release/moli
          file "$bin" || true
          ls -lh "$bin"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moli-aarch64-linux-android
          path: target/aarch64-linux-android/release/moli
          if-no-files-found: error
          retention-days: 30
